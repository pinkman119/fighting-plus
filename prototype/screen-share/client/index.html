<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>屏幕共享原型</title>
    <script src="./node_modules/socket.io-client/dist/socket.io.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #0f1216; color: #e6e9ee; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
      #login { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
      #login h1 { font-size: 24px; margin-bottom: 4px; }
      #login h1 span { color: #3b82f6; }
      #login input { width: 280px; padding: 10px 12px; background: #1e242c; border: 1px solid #2a323d; border-radius: 6px; color: #e6e9ee; font-size: 14px; outline: none; }
      #login input:focus { border-color: #3b82f6; }
      #login .btns { display: flex; gap: 10px; }
      #login .tip { font-size: 11px; color: #8b95a1; }
      button { cursor: pointer; border: 1px solid #2a323d; background: #1e242c; color: #e6e9ee; border-radius: 6px; padding: 9px 18px; font-size: 14px; }
      button:hover { background: #273039; }
      button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
      #login-error { color: #ef4444; font-size: 12px; min-height: 16px; max-width: 320px; text-align: center; }
      #room { height: 100%; display: flex; flex-direction: column; }
      #bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #171c22; border-bottom: 1px solid #2a323d; flex: none; }
      #room-info { font-size: 13px; color: #8b95a1; }
      #room-info b { color: #fbbf24; letter-spacing: 2px; }
      #status { font-size: 12px; color: #ef4444; flex: 1; text-align: right; }
      #stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      /* 远端屏幕：主区域 */
      #grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; padding: 10px; overflow: auto; }
      .cell { position: relative; background: #0b0e12; border: 1px solid #2a323d; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      .cell video { width: 100%; height: 100%; object-fit: contain; }
      .cell .label { position: absolute; left: 8px; top: 6px; font-size: 12px; background: rgba(0,0,0,0.55); border-radius: 4px; padding: 2px 8px; color: #fff; }
      .empty { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; color: #8b95a1; font-size: 14px; }
      /* 本机屏幕：固定在底部 */
      #localbar { flex: none; height: 170px; background: #171c22; border-top: 1px solid #2a323d; display: flex; align-items: center; padding: 8px 12px; gap: 12px; }
      #localwrap { position: relative; height: 100%; aspect-ratio: 16 / 9; background: #0b0e12; border: 1px solid #3b82f6; border-radius: 8px; overflow: hidden; flex: none; }
      #localwrap video { width: 100%; height: 100%; object-fit: contain; }
      #localwrap .label { position: absolute; left: 6px; top: 4px; font-size: 11px; background: rgba(0,0,0,0.55); border-radius: 4px; padding: 1px 6px; }
      #no-local { color: #8b95a1; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="login">
      <h1>屏幕共享<span>原型</span></h1>
      <input id="server" placeholder="服务器地址（默认 localhost:3100，跨机器填局域网 IP）" />
      <input id="name" placeholder="你的名字（A / B / C）" maxlength="16" />
      <input id="room" placeholder="房间码（加入时填写）" maxlength="6" style="text-transform: uppercase" />
      <div class="btns">
        <button id="create" class="primary">创建房间</button>
        <button id="join">加入房间</button>
      </div>
      <p id="login-error"></p>
      <p class="tip">其他机器测试：服务器地址填信令服务所在机器的局域网 IP，如 192.168.x.x:3100</p>
    </div>

    <div id="room" hidden>
      <div id="bar">
        <span id="room-info"></span>
        <span id="status"></span>
        <button id="share" class="primary">开始共享屏幕</button>
        <button id="leave">离开房间</button>
      </div>
      <div id="stage">
        <!-- 远端屏幕 -->
        <div id="grid"></div>
        <!-- 本机屏幕预览：固定底部 -->
        <div id="localbar">
          <div id="localwrap" hidden>
            <video id="localvideo" autoplay muted playsinline></video>
            <div class="label">我（本机屏幕）</div>
          </div>
          <div id="no-local">你尚未共享屏幕 —— 点击右上角「开始共享屏幕」</div>
        </div>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
