<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多人合流 MultiView</title>
<!-- mpegts.js：HTTP-FLV 低延迟播放；hls.js：HLS 备用播放 -->
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; color: #fff;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; }

  .stage { display: grid; width: 100%; height: 100%; gap: 6px; padding: 6px;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: 1fr 1fr; }

  .tile { position: relative; background: #101418; border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; }
  .tile.main { grid-row: 1 / span 2; }

  video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  .badge { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 16px; font-weight: 600;
    background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(4px); z-index: 2; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
  .tile.online .dot { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
  .tile.offline .dot { background: #e74c3c; }

  .placeholder { text-align: center; color: #8892a0; z-index: 1; }
  .placeholder .key { font-size: 72px; font-weight: 800; color: #2b3648; line-height: 1; }
  .placeholder .hint { font-size: 15px; margin-top: 12px; }
  .placeholder .code { color: #5ad1ff; font-family: Consolas, monospace; }

  .title { position: absolute; top: 10px; right: 12px; z-index: 2;
    padding: 4px 12px; border-radius: 6px; font-size: 14px; font-weight: 700;
    background: rgba(0, 0, 0, 0.45); color: #d8dee9; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="title">多路合流 · A / B / C</div>
  <div class="stage">
    <div class="tile main" id="tile-A">
      <video id="video-A" muted autoplay playsinline></video>
    </div>
    <div class="tile" id="tile-B">
      <video id="video-B" muted autoplay playsinline></video>
    </div>
    <div class="tile" id="tile-C">
      <video id="video-C" muted autoplay playsinline></video>
    </div>
  </div>

<script>
(function () {
  var KEYS = ['A', 'B', 'C'];
  var players = {};   // key -> { destroy(): void }
  var want = {};      // key -> boolean（该路是否在线）

  function tile(key) { return document.getElementById('tile-' + key); }
  function video(key) { return document.getElementById('video-' + key); }

  function setPlaceholder(key, on) {
    var t = tile(key);
    var ph = t.querySelector('.placeholder');
    if (on && !ph) {
      ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.innerHTML =
        '<div class="key">' + key + '</div>' +
        '<div class="hint">等待推流… OBS 推流码填 <span class="code">' + key + '</span></div>';
      t.appendChild(ph);
    }
    if (!on && ph) ph.remove();
    t.classList.toggle('offline', on);
    t.classList.toggle('online', !on);
  }

  function setBadge(key, online) {
    var t = tile(key);
    var b = t.querySelector('.badge');
    if (!b) {
      b = document.createElement('div');
      b.className = 'badge';
      b.innerHTML = '<span class="dot"></span><span class="name"></span>';
      t.appendChild(b);
    }
    b.querySelector('.name').textContent = '用户 ' + key + (online ? ' · 直播中' : ' · 离线');
  }

  /* ---------- 播放器：优先 HTTP-FLV（mpegts.js），失败回退 HLS ---------- */
  function startPlayer(key) {
    if (players[key]) return;
    var v = video(key);
    var handle = { destroy: null };

    function destroy() {
      if (handle.destroy) { try { handle.destroy(); } catch (e) {} handle.destroy = null; }
      delete players[key];
    }
    handle.destroy = destroy;
    players[key] = handle;

    if (window.mpegts && mpegts.getFeatureList().mseLivePlayback) {
      var player = mpegts.createPlayer(
        { type: 'flv', isLive: true, url: '/live/' + key + '.flv' },
        { enableWorker: false, liveBufferLatencyChasing: true, stashInitialSize: 128 }
      );
      player.attachMediaElement(v);
      player.load();
      player.play();
      handle.destroy = function () {
        try { player.pause(); player.unload(); player.detachMediaElement(); player.destroy(); } catch (e) {}
        v.src = '';
      };
      // FLV 拉流失败（如该路恰好转 HLS）→ 回退
      player.on(mpegts.Events.ERROR, function () {
        destroy();
        startHls(key);
      });
    } else {
      startHls(key);
    }
  }

  function startHls(key) {
    var v = video(key);
    if (players[key]) return;
    var handle = { destroy: null };
    handle.destroy = function () { try { hls && hls.destroy(); } catch (e) {} v.src = ''; };
    var hls = null;

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 3 });
      hls.loadSource('/live/' + key + '.m3u8');
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, function () { v.play().catch(function () {}); });
      players[key] = handle;
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = '/live/' + key + '.m3u8';
      v.play().catch(function () {});
      handle.destroy = function () { v.src = ''; };
      players[key] = handle;
    }
  }

  function stopPlayer(key) {
    if (!players[key]) return;
    players[key].destroy();
    delete players[key];
    video(key).removeAttribute('src');
  }

  /* ---------- 轮询流状态 ---------- */
  function refresh() {
    fetch('/api/streams', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        (data.streams || []).forEach(function (s) {
          setBadge(s.key, s.online);
          setPlaceholder(s.key, !s.online);
          if (s.online && !want[s.key]) startPlayer(s.key);
          if (!s.online && want[s.key]) stopPlayer(s.key);
          want[s.key] = s.online;
        });
      })
      .catch(function () { /* 服务暂不可达 */ });
  }

  KEYS.forEach(function (k) { setBadge(k, false); setPlaceholder(k, true); want[k] = false; });
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
