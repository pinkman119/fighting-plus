services:
  srs:
    image: ossrs/srs:5
    container_name: obs-multiview-srs
    restart: unless-stopped
    ports:
      # RTMP 推流端口（OBS 推流地址 rtmp://<本机IP>:1935/live）
      - "1935:1935"
      # HTTP 服务：HTTP-FLV / HLS 播放
      - "8080:8080"
      # HTTP API：供 NestJS 查询流状态（仅本机使用，不需要对外）
      - "127.0.0.1:1985:1985"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf:ro
    command: ["./objs/srs", "-c", "conf/srs.conf"]
