# SRS 流媒体服务器配置（fighting-plus）
# 接收 OBS 推流（RTMP 1935），并输出 HTTP-FLV / HLS 供页面拉流播放

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# HTTP API：NestJS 通过 http://127.0.0.1:1985/api/v1/streams 查询在线流
http_api {
    enabled         on;
    listen          1985;
}

# HTTP 服务：http://127.0.0.1:8080/live/<streamKey>.flv
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # 推流 / 停止推流时回调 NestJS（host.docker.internal 指向宿主机），使成员状态即时同步
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:3118/api/srs/hooks/publish;
        on_unpublish    http://host.docker.internal:3118/api/srs/hooks/unpublish;
    }
    # HTTP-FLV 直播（低延迟，页面优先使用）
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    # HLS 直播（备用，iOS 等不支持 MSE 的环境使用）
    hls {
        enabled         on;
        hls_fragment    1;
        hls_window      4;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }
}
